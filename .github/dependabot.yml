# Dependabot: monthly dependency updates for redswitchboard.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Go modules (the redswitchboard + redswitchboard auth rivian tools).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      go-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions workflows. Grouped so all action bumps arrive as one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The redswitchboard UBI base images (Containerfile: go-toolset + ubi-minimal).
  - package-ecosystem: "docker"
    directory: "/container/redswitchboard"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "docker"
